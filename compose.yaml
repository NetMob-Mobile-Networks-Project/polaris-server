version: '3.8'

services:
  polaris-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Database Configuration
      - DB_USER=root
      - DB_PASS=secret
      - DB_HOST=polaris-db
      - DB_PORT=3306
      - DB_NAME=polaris

      - SERVER_PORT=8080

      - JWT_SECRET=your-secret-key-here
      - API_VERSION=v1
    depends_on:
      - polaris-db
    networks:
      - polaris-network

  polaris-db:
    image: registry.docker.ir/mysql:5.7
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=polaris
    volumes:
      - polaris-db-data:/var/lib/mysql
    networks:
      - polaris-network

networks:
  polaris-network:
    driver: bridge

volumes:
  polaris-db-data: