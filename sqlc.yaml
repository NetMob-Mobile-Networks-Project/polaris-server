version: "2"
sql:
  - engine: "mysql"
    queries: "internal/storage/query"
    schema: "internal/storage/schema"
    gen:
      go:
        package: "db"
        out: "internal/storage/db"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true 